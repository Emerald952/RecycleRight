<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>RecycleRight</title>
	<link href="style.css" rel="stylesheet">
</head>
<body>
	<header>
		<nav>
			<button>Sign Up</button>
		</nav>
		
		<div id = "heading">
			<h1>Recycle Right</h1>
			<h3>Know Where Your Waste Belongs</h3>
		</div>

	</header>
	
	<main>
		<form action="searchWaste" method="get" id="searchBox">
			<input type="text" name="waste" placeholde="Enter Waste Item...">
			<button type="submit">Search</button>
		</form>
	
		<div id="categories">
			<a href="category?type=wet" class="catCard">
				<h2>Wet Waste</h2>
			</a>
			<a href="category?type=dry" class="catCard">
				<h2>Dry Waste</h2>
			</a>
			<a href="category?type=ewaste" class="catCard">
				<h2>E-Waste</h2>
			</a>
			<a href="category?type=hazardous" class="catCard">
				<h2>Hazardous Waste</h2>
			</a>
		</div>
	</main>
	
	<footer>
		<a href="recycleInfo">Recycling Number</a>
		<a href="disposeGuide">Guide to Dispose</a>
		<a href="disposalPoint">Disposal Points</a>
	
	</footer>
	
	
</body>
</html>
